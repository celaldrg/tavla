<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tavla</title>
  <meta name="description" content="Tavla (backgammon) in the browser: play the computer on Easy or Normal or a friend on one screen, move by drag or tap, in English or Turkish.">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tavla">
  <meta property="og:description" content="Tavla (backgammon) in the browser: play the computer or a friend, move by drag or tap, in English or Turkish.">
  <meta property="og:url" content="https://celaldrg.github.io/tavla/">
  <meta property="og:image" content="https://celaldrg.github.io/tavla/docs/screenshot.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%233a2213'/%3E%3Cpath%20d='M8%208h14l-7%2032zM42%208h14l-7%2032z'%20fill='%23b45309'/%3E%3Cpath%20d='M25%208h14l-7%2032z'%20fill='%23e7cfa4'/%3E%3Ccircle%20cx='22'%20cy='50'%20r='8'%20fill='%23f6ecd9'/%3E%3Ccircle%20cx='42'%20cy='50'%20r='8'%20fill='%231e130c'%20stroke='%23e7cfa4'%20stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <rect width="64" height="64" rx="14" fill="#3a2213"/>
        <path d="M8 8h14l-7 32zM42 8h14l-7 32z" fill="#b45309"/>
        <path d="M25 8h14l-7 32z" fill="#e7cfa4"/>
        <circle cx="22" cy="50" r="8" fill="#f6ecd9"/>
        <circle cx="42" cy="50" r="8" fill="#1e130c" stroke="#e7cfa4" stroke-width="2"/>
      </svg>
      <span>Tavla</span>
    </h1>
    <div class="topbar-actions">
      <button type="button" class="btn" id="new-game" data-i18n="newGame">New game</button>
      <button type="button" class="btn btn-square" id="lang-toggle" data-i18n="langButton" data-i18n-aria="langButtonLabel" aria-label="TR: Switch to Turkish">TR</button>
    </div>
  </header>

  <main class="game">
    <section class="players" data-i18n-aria="playersLabel" aria-label="Players">
      <div class="player" id="player-0">
        <span class="swatch swatch-white" aria-hidden="true"></span>
        <span class="player-name">You</span>
        <span class="player-level" hidden></span>
        <span class="player-pips">167 pips</span>
      </div>
      <div class="player" id="player-1">
        <span class="swatch swatch-black" aria-hidden="true"></span>
        <span class="player-name">Computer</span>
        <span class="player-level">Normal</span>
        <span class="player-pips">167 pips</span>
      </div>
    </section>

    <div class="board-wrap">
      <svg id="board" class="board" viewBox="0 0 796 576" tabindex="0" role="group" data-i18n-aria="boardLabel" aria-label="Tavla board" aria-describedby="status"></svg>
      <div class="result" id="result" hidden>
        <p class="result-title" id="result-title"></p>
        <p class="result-detail" id="result-detail"></p>
        <button type="button" class="btn btn-primary" id="play-again" data-i18n="playAgain">Play again</button>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="controls">
      <button type="button" class="btn" id="undo" data-i18n="undo" disabled>Undo</button>
      <button type="button" class="btn btn-primary" id="primary" disabled>Roll</button>
    </div>

    <section class="hints">
      <h2 class="hints-title" data-i18n="keysTitle">Keyboard</h2>
      <p class="hints-text" data-i18n="keyHints">Arrows pick a checker, then a target. Enter plays, Esc cancels, 1–6 moves by that die. R rolls, U undoes, N starts a new game.</p>
    </section>
  </main>

  <footer class="footer">
    <span>MIT</span>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/celaldrg/tavla" data-i18n="footerSource">Source on GitHub</a>
  </footer>

  <dialog class="dialog" id="new-game-dialog" aria-labelledby="dialog-title">
    <form method="dialog" id="new-game-form" class="dialog-form">
      <h2 class="dialog-title" id="dialog-title" data-i18n="newGame">New game</h2>
      <fieldset class="field">
        <legend data-i18n="opponent">Opponent</legend>
        <div class="segmented">
          <label class="segment"><input type="radio" name="mode" value="ai" checked><span data-i18n="computer">Computer</span></label>
          <label class="segment"><input type="radio" name="mode" value="pvp"><span data-i18n="twoPlayers">2 players</span></label>
        </div>
      </fieldset>
      <fieldset class="field" id="level-field">
        <legend data-i18n="level">Level</legend>
        <div class="segmented">
          <label class="segment"><input type="radio" name="level" value="easy"><span data-i18n="easy">Easy</span></label>
          <label class="segment"><input type="radio" name="level" value="normal" checked><span data-i18n="normal">Normal</span></label>
        </div>
      </fieldset>
      <div class="dialog-actions">
        <button type="button" class="btn" id="dialog-cancel" data-i18n="cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" data-i18n="start">Start</button>
      </div>
    </form>
  </dialog>
</body>
</html>
